name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: WebAssembly
        run: |
          GOOS=js GOARCH=wasm go vet ./...
          PATH="$(go env GOROOT)/lib/wasm:$PATH" GOOS=js GOARCH=wasm go test ./...
          GOOS=js GOARCH=wasm go build -o /dev/null .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t respkv:ci .

      - name: Smoke test
        run: |
          docker run -d --name respkv -p 127.0.0.1:6379:6379 respkv:ci
          for attempt in $(seq 1 20); do
            if [ "$(docker run --rm --network host redis:7 redis-cli ping 2>/dev/null)" = "PONG" ]; then
              docker stop respkv
              exit 0
            fi
            sleep 0.5
          done
          docker logs respkv
          exit 1
